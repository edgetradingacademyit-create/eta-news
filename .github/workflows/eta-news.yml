name: ETA News

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Cosa inviare"
        type: choice
        default: test
        options: [test, oggi, settimana, auto]

permissions:
  contents: write

concurrency:
  group: eta-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Calendario economico
        run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
      - name: Salva stato
        run: |
          git config user.name "eta-news-bot"
          git config user.email "eta-news-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Aggiorna stato" && git push)
